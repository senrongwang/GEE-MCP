# AI GEE Downloader 配置文件
# 安全设计（第 37 节）：本地 MCP 必须限制 AI 能访问的本地路径。

gee:
  # Earth Engine 项目 ID（在 console.cloud.google.com 创建后填入）
  project: "melodic-media-436902-v0"
  # 认证超时（秒）
  auth_timeout: 300

download:
  default_crs: "EPSG:3857"
  default_format: "GeoTIFF"
  # 导出任务允许的最大像素数
  default_max_pixels: 10000000000000

filesystem:
  # 默认输出目录
  default_output: "D:/GEE_Data"
  # AI 允许写入的根目录白名单（必须显式列出）
  allowed_roots:
    - "D:/GEE_Data"

planner:
  # Direct Download 单文件阈值（估算超过则建议 Export；GEE 分块请求上限 48MiB）
  direct_download_max_mb: 30
  # 最大 grid dimension（GEE 限制 10000，保守设置）
  max_grid_dimension: 9000
  # 本地直下分片数保护上限（默认永不自动 Export；分片超过此数时报错，请缩小范围）
  max_direct_tiles: 1000
  # 单次 getDownloadURL 请求字节预算（P0-1；GEE 实际上限 50331648 字节=48MiB，
  # 且按 float64 8B/px 计算请求大小；分块像素 = 预算 ÷ 8）
  max_direct_request_bytes: 46137344
  # 仅当用户显式 strategy="export" 时使用 Export Task（远程中转，默认不用）
  export_force_threshold: 3

qa:
  # QA 内容级检查（P1-6）：非零像元占比下限；低于视为异常（如整景全 0）。
  # 海洋/掩膜较多的数据正常占比约 27~35%，请勿设过高。
  min_valid_fraction: 0.01

network:
  timeout: 300
  retry: 3

logging:
  level: "INFO"
  # 日志中禁止出现任何凭据 / token / 私密信息
  redact_secrets: true

drive:
  # Google Drive 本地回传：临时下载目录
  temp_dir: "D:/GEE_Data/.tmp_drive"
  # 下载完成后是否删除 Drive 远端文件
  delete_remote_after_download: false

catalog:
  # GEE 数据集发现（Dataset Discovery）：
  # 本地 Catalog 数据库（SQLite + FTS5）
  db_path: "data/gee_catalog.db"
  # 官方 GEE STAC Catalog 入口（gee_catalog_update 抓取源）
  stac_catalog_url: "https://storage.googleapis.com/earthengine-stac/catalog/catalog.json"
  # 并发抓取线程数
  concurrency: 8
  # 单次请求超时（秒）
  request_timeout: 60
  # 请求失败重试次数
  retry: 3
  # 数据集验证结果缓存 TTL（小时）
  validation_cache_ttl_hours: 1
  # Catalog 超过该天数未更新时搜索返回过期警告
  stale_days: 60
